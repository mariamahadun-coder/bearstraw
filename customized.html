<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customize | Sereia Craft</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Dancing Script', cursive;
}

.oblong-title{
    background: linear-gradient(45deg,#f8bbd9,#f48fb1);
    border-radius:50px;
    padding:15px 30px;
    display:inline-block;
    color:white;
    border:2px solid white;
    box-shadow:0 4px 8px rgba(0,0,0,0.2);
}

.stylish-border{
    border:2px solid rgba(255,255,255,0.55);
    box-shadow:0 10px 30px rgba(244,143,177,0.15);
}
</style>
</head>

<body class="bg-pink-50 text-pink-900">

<header class="bg-pink-200 py-8 text-center stylish-border mx-4 my-6 rounded-[2rem]">

<div class="oblong-title mx-auto">
<h1 class="text-5xl font-bold text-white">Customize Your Order 💕</h1>
</div>

<p class="text-lg text-pink-700 mt-6">
Create your dreamy fuzzy craft ✨
</p>

<a href="website.html"
class="inline-block mt-6 bg-pink-500 text-white px-8 py-3 rounded-full hover:bg-pink-600 transition border-2 border-white shadow-lg">
🌸 Back to Boutique
</a>

</header>

<main class="mx-4 mb-10">

<section class="bg-pink-100 stylish-border rounded-[2rem] p-8 mx-auto max-w-4xl shadow-xl shadow-pink-200">

<div class="text-center mb-10">
<h2 class="text-4xl font-bold text-pink-800 mb-4">Coquette Customization 🎀</h2>

<p class="text-pink-700 text-lg">
You are customizing: <span id="productName" class="font-bold text-pink-600"></span>
</p>

</div>

<form class="space-y-6">

<!-- NAME -->
<label class="block text-pink-800">
Your Name
<input type="text" class="mt-2 w-full rounded-3xl border border-pink-300 bg-white px-4 py-3">
</label>

<!-- EMAIL -->
<label class="block text-pink-800">
Email
<input type="email" class="mt-2 w-full rounded-3xl border border-pink-300 bg-white px-4 py-3">
</label>

<!-- COLOR THEME (UPDATED + MORE OPTIONS) -->
<label class="block text-pink-800">
Color Theme
<select class="mt-2 w-full rounded-3xl border border-pink-300 bg-white px-4 py-3">
<option>Pastel Pink</option>
<option>Soft Peach</option>
<option>Lavender Dream</option>
<option>Baby Blue</option>
<option>Mint Green</option>
<option>White & Gold Elegance</option>
<option>Coquette Pink Aesthetic</option>
<option>Dark Cherry Romance</option>
</select>
</label>

<!-- REQUESTED COLOR -->
<label class="block text-pink-800">
Requested Color (optional)
<input type="text"
placeholder="e.g. dusty rose, pastel rainbow, deep red..."
class="mt-2 w-full rounded-3xl border border-pink-300 bg-white px-4 py-3">
</label>

<!-- SPECIAL REQUEST -->
<label class="block text-pink-800">
Special Request ✨
<textarea rows="5"
placeholder="Describe your dream design..."
class="mt-2 w-full rounded-3xl border border-pink-300 bg-white px-4 py-3"></textarea>
</label>

<!-- SUBMIT -->
<button type="submit"
class="w-full rounded-full bg-gradient-to-r from-pink-400 to-pink-500 px-8 py-4 text-white text-xl font-semibold hover:from-pink-500 hover:to-pink-600 border-2 border-white shadow-lg">
💕 Submit Customization
</button>

</form>

</section>

</main>

<!-- AUTO PRODUCT DISPLAY -->
<script>
const params = new URLSearchParams(window.location.search);
let product = params.get("product");

if(product === "keychain") product = "Fuzzy Wire Keychain";
if(product === "phone") product = "Phone Charm";
if(product === "hair") product = "Hair Accessory";
if(product === "bouquet") product = "Bouquet";

document.getElementById("productName").textContent = product || "Unknown Item";
</script>

</body>
</html>
